name: Global semiconductor industry
slug: semiconductors
created: '2026-09-29'
methodology_version: 0.1.0
atlas_version: 0.0.0
scope:
  definition: 'The global semiconductor industry end to end: materials, equipment,
    design (incl. EDA/IP), wafer fabrication, assembly/test/packaging, distribution,
    and the end markets and policy regimes that shape it. Exact boundaries are a Phase
    0 research question.'
  exclusions: Boundaries to be established in Phase 0 (e.g. how far into electronics
    manufacturing, displays, and passive components the atlas goes).
  geography: 'Global, with regional breakdowns (assumed: user asked for ''the full
    semiconductor industry'' without a region).'
  time_horizon: History from the industry's origins for context; current state as
    of the research date, with every figure dated.
  audience: Beginner with no industry background; must also be auditable by an experienced
    operator.
stale_after_days: 365
research:
  researchers_per_wave: 6
  fact_check: all
  stop_when_duplicate_share_above: 0.6
scoring:
  criteria:
  - id: pain_severity
    name: Pain severity (evidenced)
    weight: 3
    direction: higher_is_better
  - id: pain_frequency
    name: How many participants have it
    weight: 2
    direction: higher_is_better
  - id: willingness_to_pay
    name: Evidence of budget / spend
    weight: 3
    direction: higher_is_better
  - id: incumbent_gap
    name: Gap left by existing solutions
    weight: 2
    direction: higher_is_better
  - id: regulatory_barrier
    name: Regulatory barrier to entry
    weight: 2
    direction: lower_is_better
  - id: capital_intensity
    name: Capital needed to reach first revenue
    weight: 2
    direction: lower_is_better
  - id: founder_fit
    name: Fit with founder's skills and access
    weight: 2
    direction: higher_is_better
